<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #ff6b6b, #5f27cd, #48dbfb);
    font-family: system-ui, sans-serif;
  }

  /* Ported LiquidGlass Container */
  .liquid-glass {
    position: relative;
    padding: 2rem 3rem;
    border-radius: 24px;
    color: white;
    overflow: hidden;

    /* Tint & Frosted Blur */
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: url(#liquid-glass-filter) blur(4px);
    -webkit-backdrop-filter: blur(12px); /* Safari/WebKit fallback */

    /* Specular Edge Highlights & Depth */
    border: 1px solid rgba(255, 255, 255, 0.4);
    box-shadow: 
      0 8px 32px rgba(0, 0, 0, 0.2),
      inset 0 1px 1px rgba(255, 255, 255, 0.6),
      inset 0 -1px 2px rgba(0, 0, 0, 0.15);
  }

  /* Ensure content stays crisp above the filter */
  .liquid-glass-content {
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>

  <!-- Hidden SVG Filter Engine (Replaces the React SVG wrapper) -->
  <svg style="display: none;" aria-hidden="true">
    <defs>
      <filter id="liquid-glass-filter" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <!-- Generates organic liquid waves (turbulenceBaseFrequency & turbulenceSeed) -->
        <feTurbulence 
          type="fractalNoise" 
          baseFrequency="0.008 0.008" 
          numOctaves="2" 
          seed="2" 
          result="noise" 
        />
        <!-- Softens the noise for smooth glass bending -->
        <feGaussianBlur in="noise" stdDeviation="2" result="softNoise" />
        <!-- Bends the background pixels (displacementScale) -->
        <feDisplacementMap 
          in="SourceGraphic" 
          in2="softNoise" 
          scale="60" 
          xChannelSelector="R" 
          yChannelSelector="G" 
        />
      </filter>
    </defs>
  </svg>

  <!-- Component Markup -->
  <div class="liquid-glass">
    <div class="liquid-glass-content">
      <h2>Liquid Glass</h2>
      <p>Pure HTML, CSS, and SVG refraction.</p>
    </div>
  </div>

</body>
</html>
