<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- Style -->
    <link rel="stylesheet" href="../styles/liquidGlassReference.css">
</head>
<body>

  <!-- Hidden SVG Filter for Fluid Refraction -->
<svg width="0" height="0" style="position: absolute;">
    <defs>
      <filter id="liquid-refraction">
        <feTurbulence 
          type="fractalNoise" 
          baseFrequency="0.015" 
          numOctaves="2" 
          seed="3" 
          result="noise" 
        />
        <feGaussianBlur in="noise" stdDeviation="3" result="softNoise" />
        <feDisplacementMap 
          in="SourceGraphic" 
          in2="softNoise" 
          scale="28" 
          xChannelSelector="R" 
          yChannelSelector="G" 
        />
      </filter>
    </defs>
</svg>

<div class="liquid-glass">
    <h2>Liquid Glass</h2>
    <p>Refractive translucency built with CSS and SVG displacement filters.</p>
</div>

</body>
</html>
